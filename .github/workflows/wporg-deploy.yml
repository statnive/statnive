name: Deploy to WordPress.org

# Publishes to https://plugins.svn.wordpress.org/statnive/ on every published
# GitHub release. Trigger limited to `release: published` so WP.org Rule 14
# ("avoid frequent commits") is respected — trunk only updates on intentional
# releases, never on push or readme tweaks. Concurrency group is a singleton
# (not per-ref) so two near-simultaneous releases serialize through SVN cleanly.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WP.org SVN
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Compute SVN version (strip leading 'v' from git tag)
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not produce a valid X.Y.Z version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Derived SVN version: $VERSION"

      - name: Verify readme.txt Stable tag matches release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STABLE_TAG=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '[:space:]')
          if [ "$VERSION" != "$STABLE_TAG" ]; then
            echo "::error::readme.txt Stable tag ($STABLE_TAG) does not match release version ($VERSION)"
            exit 1
          fi
          echo "Stable tag $STABLE_TAG matches release $VERSION"

      - name: Setup PHP
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # v2.31.1
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: statnive
          VERSION: ${{ steps.version.outputs.version }}
