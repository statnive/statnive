name: Deploy to WordPress.org

# Publishes to https://plugins.svn.wordpress.org/statnive/. Two triggers:
#
# 1. release: published — fires automatically when a GitHub release is published.
#    GHA reads the workflow file from the tag's commit, so the tag MUST contain
#    this workflow file. Use this for v0.4.14 onwards. Source deployed = tag's
#    commit.
#
# 2. workflow_dispatch — manual trigger with `version` input. Used to ship
#    v0.4.13 (whose tag predates this workflow) and as a safety net for retries.
#    Source deployed = the branch the workflow was dispatched from (default
#    branch unless `gh workflow run ... --ref <branch>` is passed). The
#    `version` input only sets the SVN tag name and is verified against
#    readme.txt Stable tag.
#
# WP.org Rule 14 ("avoid frequent commits") respected — trunk only updates on
# intentional triggers, never on push or readme tweaks. Concurrency group is a
# singleton so two near-simultaneous deploys serialize through SVN cleanly
# (SVN doesn't handle concurrent writes well).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z version to deploy (must match readme.txt Stable tag and a vX.Y.Z git tag)'
        required: true
        type: string
      dry_run:
        description: 'Preview SVN changes without committing (recommended for first SVN push)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WP.org SVN
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Default behaviour:
          # - release event → GITHUB_REF = refs/tags/vX.Y.Z → tag checked out.
          # - workflow_dispatch → GITHUB_REF = the dispatched branch
          #   (default branch unless --ref overrides).
          fetch-depth: 1

      - name: Compute SVN version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not a valid X.Y.Z semver"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Derived SVN version: $VERSION"

      - name: Verify readme.txt Stable tag matches release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STABLE_TAG=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '[:space:]')
          if [ "$VERSION" != "$STABLE_TAG" ]; then
            echo "::error::readme.txt Stable tag ($STABLE_TAG) does not match release version ($VERSION)"
            exit 1
          fi
          echo "Stable tag $STABLE_TAG matches release $VERSION"

      - name: Setup PHP
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # v2.31.1
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        with:
          dry-run: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: statnive
          VERSION: ${{ steps.version.outputs.version }}
