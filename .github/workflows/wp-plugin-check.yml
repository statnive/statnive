name: WP Plugin Check

# Checklist §18 — Plugin Check (PCP) pre-submission gate.
# Runs the official wordpress/plugin-check-action against the built dist directory
# on every PR + nightly. Fails on ANY plugin_repo error OR warning — WP.org
# reviewers see both, so both block submission.

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  schedule:
    - cron: '0 6 * * *'  # Nightly 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # PCP action posts check results as a PR comment

jobs:
  plugin-check:
    name: PCP — plugin_repo category (§18)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Install Node dependencies and build
        run: |
          npm ci
          npm run build

      # Plugin Check derives the plugin slug from the build directory name,
      # which then drives the expected text-domain. The directory MUST be
      # named `statnive` so the i18n text-domain check matches the plugin's
      # declared `Text Domain: statnive`. (Previously this was `dist-statnive`
      # which produced TextDomainMismatch errors against the live `statnive`
      # text domain.)
      - name: Build distribution directory
        run: |
          mkdir -p ../statnive-dist/statnive
          rsync -rc --exclude-from=.distignore ./ ../statnive-dist/statnive/
          ls -la ../statnive-dist/statnive/

      # Run the official action.
      #
      # Known-broken upstream: wordpress/plugin-check-action#579 — after
      # GitHub rolled ubuntu24/20260525.161 (Node 24.16.0 / libuv 1.52.1),
      # `@wordpress/env`'s URL-source plugin download path silently exits
      # status 0 without starting Docker. The action auto-generates a
      # `.wp-env.json` that declares plugin-check as a URL plugin, so every
      # PCP CI run on this image fails with "Environment not initialized".
      # Confirmed reproducible across multiple WP plugin maintainers
      # (bisection by @westonruter on issue #579, 2026-05-28).
      #
      # `continue-on-error: true` keeps PCP failures visible in the PR
      # check log without blocking merge. PCP locally during the release
      # SKILL (`/statnive-release`) remains the canonical §18 gate per the
      # learn-statnive-plugin.md "wp-env Local Bootstrap" lesson.
      #
      # REMOVE this once plugin-check-action ships v1.1.7+ with the
      # upstream fix (install plugin-check via wp-cli post-start instead of
      # via URL plugin in .wp-env.json).
      - name: Run official Plugin Check (plugin_repo category)
        uses: wordpress/plugin-check-action@18573eb38f13543484a1f095672dae3849a4fbb0 # v1.1.6
        continue-on-error: true
        with:
          build-dir: ../statnive-dist/statnive
          categories: plugin_repo
          exclude-directories: vendor,node_modules,tests,src/Dependencies
          strict: true
