name: WP Plugin Check

# Checklist §18 — Plugin Check (PCP) pre-submission gate.
# Runs the official wordpress/plugin-check-action against the built dist directory
# on every PR + nightly. Fails on ANY plugin_repo error OR warning — WP.org
# reviewers see both, so both block submission.

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  schedule:
    - cron: '0 6 * * *'  # Nightly 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # PCP action posts check results as a PR comment

jobs:
  plugin-check:
    name: PCP — plugin_repo category (§18)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Install Node dependencies and build
        run: |
          npm ci
          npm run build

      # Plugin Check derives the plugin slug from the build directory name,
      # which then drives the expected text-domain. The directory MUST be
      # named `statnive` so the i18n text-domain check matches the plugin's
      # declared `Text Domain: statnive`. (Previously this was `dist-statnive`
      # which produced TextDomainMismatch errors against the live `statnive`
      # text domain.)
      - name: Build distribution directory
        run: |
          mkdir -p ../statnive-dist/statnive
          rsync -rc --exclude-from=.distignore ./ ../statnive-dist/statnive/
          ls -la ../statnive-dist/statnive/

      # WORKAROUND for wordpress/plugin-check-action#579 (upstream, no patched
      # release yet as of 2026-05-31). The official action auto-generates a
      # `.wp-env.json` that declares plugin-check as a URL plugin. On the new
      # ubuntu24/20260525.161 runner image (Node 24.16.0 / libuv 1.52.1) the
      # @wordpress/env URL-source download path silently exits 0 without
      # actually starting Docker — every job that uses the action fails with
      # "Environment not initialized" on the next `wp-env run cli` call.
      #
      # Fix from @westonruter (upstream issue #579 comment): install
      # plugin-check via wp-cli AFTER wp-env start, not via the URL plugin
      # path. We inline that here. Switch back to the official action once
      # plugin-check-action ships v1.1.7+ with the same fix.
      - name: Install @wordpress/env
        run: npm install -g @wordpress/env

      - name: Generate .wp-env.json (no URL plugin)
        working-directory: ../statnive-dist/statnive
        run: |
          cat > .wp-env.json <<'EOF'
          {
            "core": "latest",
            "port": 8880,
            "testsPort": 8881,
            "plugins": ["."]
          }
          EOF

      - name: Start wp-env
        working-directory: ../statnive-dist/statnive
        run: wp-env start --update

      - name: Install plugin-check via wp-cli (bypass URL-source bug)
        working-directory: ../statnive-dist/statnive
        run: wp-env run cli wp plugin install plugin-check --activate

      - name: Activate statnive
        working-directory: ../statnive-dist/statnive
        run: wp-env run cli wp plugin activate statnive

      - name: Run Plugin Check (plugin_repo category, strict)
        working-directory: ../statnive-dist/statnive
        run: |
          set -o pipefail
          wp-env run cli wp plugin check statnive \
            --categories=plugin_repo \
            --exclude-directories=vendor,node_modules,tests,src/Dependencies \
            --format=json \
            --require=./wp-content/plugins/plugin-check/cli.php \
            > "$RUNNER_TEMP/plugin-check-results.txt"
          cat "$RUNNER_TEMP/plugin-check-results.txt"
          # Strict mode: any error OR warning fails the job.
          python3 - <<'PY'
          import json, os, sys
          with open(os.environ['RUNNER_TEMP'] + '/plugin-check-results.txt') as f:
              data = json.load(f)
          errors = data.get('errors', {}) or {}
          warnings = data.get('warnings', {}) or {}
          total_errors = sum(len(v) for v in errors.values())
          total_warnings = sum(len(v) for v in warnings.values())
          print(f'Plugin Check results: {total_errors} errors, {total_warnings} warnings')
          if total_errors or total_warnings:
              sys.exit(1)
          PY

      - name: Upload Plugin Check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.0
        with:
          name: plugin-check-results
          path: ${{ runner.temp }}/plugin-check-results.txt
          if-no-files-found: ignore
