name: E2E

on:
  pull_request:
    branches: [main, master, development]

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright against wp-env
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WP_BASE_URL: http://localhost:8889
      WP_REST_URL: http://localhost:8889/wp-json
      WP_ADMIN_USER: admin
      WP_ADMIN_PASSWORD: password
      WP_TABLE_PREFIX: wp_
      WP_ROOT: ${{ github.workspace }}/wp-env-files/wordpress
      STATNIVE_E2E_DEBUG: '1'
      STATNIVE_E2E_IP_FILTER: '1'
      STATNIVE_E2E_CONSENT_STUB: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # v2.31.1
        with:
          php-version: '8.2'
          tools: composer:v2, wp-cli
          coverage: none

      - name: Install node deps
        run: npm ci

      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx -y @wordpress/env@10.0.0 start --update

      # wp-env runs WordPress inside a Docker container, so the host-side
      # cpSync in tests/e2e/global-setup.ts can't reach the container's
      # mu-plugins directory. Drop them in through `wp-env run tests-cli`
      # — the plugin tree is mounted at /var/www/html/wp-content/plugins/
      # statnive, so the mu-plugin sources are already inside the box and
      # just need to be moved next to the .statnive-e2e-on sentinel.
      - name: Install test mu-plugins into wp-env container
        run: |
          npx -y @wordpress/env@10.0.0 run tests-cli bash -c '
            set -eux
            mkdir -p /var/www/html/wp-content/mu-plugins
            cp /var/www/html/wp-content/plugins/statnive/tests/e2e/fixtures/mu-plugins/statnive-ip-filter.php /var/www/html/wp-content/mu-plugins/
            cp /var/www/html/wp-content/plugins/statnive/tests/e2e/fixtures/mu-plugins/statnive-consent-stub.php /var/www/html/wp-content/mu-plugins/
            cp /var/www/html/wp-content/plugins/statnive/tests/e2e/fixtures/mu-plugins/statnive-e2e-debug.php /var/www/html/wp-content/mu-plugins/
            printf "1" > /var/www/html/wp-content/mu-plugins/.statnive-e2e-on
            ls -la /var/www/html/wp-content/mu-plugins
          '

      # CI runs only the UI-focused settings specs that work against any
      # WordPress host. The tracking-side specs (cookieless, DNT/GPC,
      # retention, exclusions, invariants) rely on the mysql-over-socket
      # helper in tests/e2e/db-cli.ts which targets Local WP's per-site
      # socket — those stay a local-dev check until wp-env's TCP port is
      # threaded through the harness. Save button + Email-removed +
      # current-IP hint + Full-Tracking removal are full coverage of the
      # changes in this PR and run in < 2 minutes.
      - name: Run E2E suite (UI specs)
        env:
          STATNIVE_E2E_SKIP_MU_COPY: '1'
        run: npx playwright test
          tests/e2e/specs/settings-save-button.spec.ts
          tests/e2e/specs/settings-email-removed.spec.ts
          tests/e2e/specs/settings-current-ip-hint.spec.ts
          tests/e2e/specs/settings-consent-fulltracking-removed.spec.ts
          --grep-invert "CM-8"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
